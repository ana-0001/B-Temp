<!doctype html>
<!--
  @file        : index.html
  @description  : نقطة الدخول — بنحمّل خط Plus Jakarta Sans + الثيم المبدئي قبل ما React يشتغل علشان نتجنب وميض الثيم.
-->
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <title>B-Temp</title>
    <!-- cspell:ignore FOUC -->
    <script>// تطبيق الثيم واللغة فوراً لتجنب وميض الشاشة — بيقرأ من نفس مفتاح المخزن الفعال (vh-settings)
      (() => {
        try {
          const { language: lang = "en", theme = "light" } = JSON.parse(localStorage.getItem('vh-settings'))?.state || {};
          // لو الثيم "system" بنحله فوراً قبل الرسم — بنفس منطق getResolvedTheme في settings.store.ts
          const resolvedTheme = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          const doc = document.documentElement;
          doc.lang = lang; doc.dir = lang === "ar" ? "rtl" : "ltr";
          doc.dataset.theme = resolvedTheme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
